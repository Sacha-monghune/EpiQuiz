services:
  backend:
    build: ./back-end/project-name
    container_name: backend
    ports:
      - "4000:4000"
    env_file:
      - ./back-end/project-name/.env
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build: ./front-end/epiquiz
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - ./front-end/epiquiz/.env
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: postgres:14
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres-data:
